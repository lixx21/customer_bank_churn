
services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    networks:
      - network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgAdmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: "123456"
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadminvolume:/var/lib/pgadmin
    networks:
      - network
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    build: .
    container_name: customer_churn_mlflow
    entrypoint: ["/bin/bash", "/app/start_mlflow.sh"]
    environment:
      PGPASSWORD: admin
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlartifacts
      - ./start_mlflow.sh:/app/start_mlflow.sh:ro
    networks:
      - network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pipeline:
    build: .
    container_name: customer_churn_pipeline
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - network
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    command: ["./run_pipeline.sh"]

  app:
    build: .
    container_name: customer_churn_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - network
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
  pgadminvolume:
